name: Hourly ISIN update

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run ISIN updater
        env:
          TOKEN: ${{ secrets.TOKEN }}
          ENDPOINT: ${{ secrets.ENDPOINT }}
        run: go run .
